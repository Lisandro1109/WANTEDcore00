# Pila local de WANTED core.
# Hoy levanta PostgreSQL y Redis. API, web y el worker de WhatsApp
# se agregan cuando existan esas aplicaciones.
# Los volúmenes de sesiones y archivos entran con el worker.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wanted
      POSTGRES_PASSWORD: wanted
      POSTGRES_DB: wanted
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanted -d wanted"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
